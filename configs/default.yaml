# All tunable values live here. Paths point outside the repo; change them for your machine.

data:
  meld_root: D:/data/MELD/MELD.Raw   # the extracted raw release (CSVs + mp4 folders)
  wav_root: D:/data/MELD/wav         # extract_audio.py writes wav_root/<split>/dia{D}_utt{U}.wav
  splits:
    train: {csv: train_sent_emo.csv, clips: train_splits}
    dev: {csv: dev_sent_emo.csv, clips: dev_splits_complete}
    test: {csv: test_sent_emo.csv, clips: output_repeated_splits_test}
  feature_root: D:/data/MELD/wavlm   # cache_audio.py writes feature_root/<split>/dia{D}_utt{U}.npy
  context_k: 2                       # previous utterances from the same dialogue

audio:
  sample_rate: 16000
  max_seconds: 15                    # same cap as a live turn
  min_seconds: 0.3                   # shorter clips are skipped when caching features (see DECISIONS.md)
  wavlm_model: microsoft/wavlm-base-plus

text:
  model: roberta-base
  max_tokens: 128                    # longer inputs lose their oldest context tokens
  batch_size: 8
  grad_accum: 2                      # effective batch of 16
  lr: 2.0e-5
  epochs: 3
  class_weighting: sqrt_inv          # sqrt_inv, inv, or none (see DECISIONS.md)
  checkpoint_dir: checkpoints/text
  run_dir: runs/text

audio_head:
  hidden: 256
  dropout: 0.2
  lr: 1.0e-3
  batch_size: 64
  epochs: 30
  class_weighting: sqrt_inv          # same scheme as the text model
  checkpoint: checkpoints/audio/best.pt
  run_dir: runs/audio

fusion:
  alpha_step: 0.05                   # grid for the weight on text, tuned on dev
  conflict_min_conf: 0.4             # both models must be at least this sure for a tone/text conflict
  run_dir: runs/fusion

eval:
  run_dir: runs/final_eval
  bench_dir: runs/bench
  max_params: 6000000000             # the challenge's cap on learned parameters

pipeline:
  frame_samples: 512                 # 32 ms at 16 kHz, the frame size Silero VAD expects
  start_ms: 250                      # this much speech in a row starts a turn
  end_silence_ms: 600                # this much silence in a row ends it
  max_turn_s: 15                     # a turn is force-ended here
  preroll_ms: 200                    # audio kept from before the turn was detected, so the first word is whole
  vad_threshold: 0.5                 # Silero speech probability at or above this counts as speech
  history_turns: 3                   # past turns kept for context and for the reply prompt
  speaker_name: Speaker              # name used for the live speaker in the text model's input

asr:
  model: small.en                    # Whisper small, English
  compute_type: int8
  beam_size: 1

reply:
  url: http://127.0.0.1:11434        # Ollama, local only
  model: qwen2.5:1.5b
  max_tokens: 64
  temperature: 0.6
  seed: 0
  keep_alive: 30m                    # keep the model loaded between turns
  low_conf: 0.45                     # below this fused confidence the robot checks in instead of assuming

voice:
  repo: hexgrad/Kokoro-82M
  device: cuda                       # cuda or cpu (see DECISIONS.md for the measured difference)
  lang_code: a                       # American English
  voice: af_heart
  speed: 1.0
  mute_tail_ms: 200                  # extra wait after the robot stops speaking before the mic is used again
